        - listitem [ref=f2e14]: A and B are fused. The tracery arc and the petal beam run phase‑locked, so the band reads as the light source and the petals as what it falls on.
        - listitem [ref=f2e15]: Resting opacity raised from .14 to .26. At .14 the window washed out to pastel between passes and looked sickly at 48px.
