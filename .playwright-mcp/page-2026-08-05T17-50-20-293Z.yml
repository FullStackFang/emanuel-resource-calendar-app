      - list [ref=f2e9]:
        - listitem [ref=f2e10]: Petal is geometric. Circular head, pinched neck, hard horizontal shoulder, straight‑sided tapering wedge, pointed foot. v1 had a soft paisley with curved sides.
        - listitem [ref=f2e11]: The white "eye" is gone. I invented it; the trace shows the head is solid.
        - listitem [ref=f2e12]: Ornament band is real. Three keystones per petal, one on‑axis and two flanking at ±8°, at radius 35–40 of 50. v1 had one dot in the wrong place.
